<text x="600" y="781" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Times New Roman, serif" font-size="23" font-weight="400" fill="#222"><tspan x="600" dy="0">6. 管理端审批通过/驳回/转线下</tspan></text>
