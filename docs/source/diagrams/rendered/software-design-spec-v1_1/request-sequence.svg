<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#666'/></marker></defs>
<rect width='100%' height='100%' fill='#ffffff'/>
<text x="600" y="54" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Times New Roman, serif" font-size="34" font-weight="700" fill="#222"><tspan x="600" dy="0">事务申请顺序</tspan></text>
<rect x="210" y="130" width="780" height="82" rx="18" fill="#ffffff" stroke="#b70f24" stroke-width="3"/>
