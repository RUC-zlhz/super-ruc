<text x="600" y="903" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Times New Roman, serif" font-size="23" font-weight="400" fill="#222"><tspan x="600" dy="0">7. 学生查看状态、意见与证明预览</tspan></text>
