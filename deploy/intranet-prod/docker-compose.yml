name: super-ruc-intranet-prod

services:
  db:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-docker.m.daocloud.io/minio/minio:latest}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      network: host
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-http://127.0.0.1:18081}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-http://127.0.0.1:18081}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,db,redis,minio,backend,web}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      API_V1_PREFIX: /api/v1
      DATABASE_URL: ${DATABASE_URL}
      KINGBASE_DATABASE_URL: ${KINGBASE_DATABASE_URL:-}
      DATABASE_ECHO: "false"
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      REDIS_URL: ${REDIS_URL}
      AUDIT_ARCHIVE_ENABLED: ${AUDIT_ARCHIVE_ENABLED:-false}
      AUDIT_ARCHIVE_RUN_AT: ${AUDIT_ARCHIVE_RUN_AT:-03:30}
      AUDIT_ARCHIVE_RETENTION_DAYS: ${AUDIT_ARCHIVE_RETENTION_DAYS:-180}
      AUDIT_ARCHIVE_BATCH_SIZE: ${AUDIT_ARCHIVE_BATCH_SIZE:-1000}
      AUDIT_ARCHIVE_LOCK_TTL_SECONDS: ${AUDIT_ARCHIVE_LOCK_TTL_SECONDS:-3600}
      WORKFLOW_REMINDER_ENABLED: ${WORKFLOW_REMINDER_ENABLED:-true}
      WORKFLOW_REMINDER_INTERVAL_MINUTES: ${WORKFLOW_REMINDER_INTERVAL_MINUTES:-60}
      WORKFLOW_REMINDER_LOCK_TTL_SECONDS: ${WORKFLOW_REMINDER_LOCK_TTL_SECONDS:-1800}
      WORKFLOW_REMINDER_CHANNEL: IN_APP
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"
      MINIO_BUCKET_ATTACHMENT: ${MINIO_BUCKET_ATTACHMENT:-sip-attachments}
      MINIO_BUCKET_TEMPLATE: ${MINIO_BUCKET_TEMPLATE:-sip-templates}
      MINIO_BUCKET_EXPORT: ${MINIO_BUCKET_EXPORT:-sip-exports}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-14}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      WECHAT_APPID: ${WECHAT_APPID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      WECHAT_MOCK_ENABLED: "false"
      WECHAT_SUBSCRIBE_ENABLED: ${WECHAT_SUBSCRIBE_ENABLED:-false}
      WECHAT_SUBSCRIBE_REMINDER_TEMPLATE_ID: ${WECHAT_SUBSCRIBE_REMINDER_TEMPLATE_ID:-}
      WECHAT_SUBSCRIBE_REQUEST_TEMPLATE_ID: ${WECHAT_SUBSCRIBE_REQUEST_TEMPLATE_ID:-}
      AI_QA_ENABLED: ${AI_QA_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_ACCESS_KEY: ${SMS_ACCESS_KEY:-}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY:-}
      SMS_SIGN: ${SMS_SIGN:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@sip.example.edu}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-30}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: deploy/intranet-prod/web.Dockerfile
      network: host
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:20-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
        VITE_API_BASE: /api/v1
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-http://127.0.0.1:18081}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-http://127.0.0.1:18081}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,db,redis,minio,backend,web}
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
