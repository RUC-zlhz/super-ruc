[project]
name = "sip-backend"
version = "0.1.0"
description = "信息学院学生综合服务与党团管理平台 — 后端 API 服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<0.120",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "minio>=7.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pywin32>=306; sys_platform == 'win32'",
    "weasyprint>=61",
    "anthropic>=0.25",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "email-validator>=2.1",
    "pypdf>=6.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"app/auth/schemas.py" = ["S105"]
"app/core/config.py" = ["S104", "S105", "N802"]
"app/core/security.py" = ["S105", "S107"]
"tests/integration/test_auth_flow.py" = ["S105"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "unit_tests"]
cache_dir = ".tmp/pytest-cache"
addopts = "--basetemp=.tmp/pytest-tmp"
